name: CI

# 测试全部离线（连 DNS 都是打桩的），所以这套 CI 不需要任何凭据或网络信源，
# fork 上的 PR 也能跑绿。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 是 requires-python 的下界，3.13 是当前开发用的版本。
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 只装 .[dev]，故意不装 mcp——这样能顺带钉住「不装 MCP SDK 也能 import
      # 全部模块跑 REST」这条约定（mcp_server.py 是延迟导入）。
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: 导入自检（缺声明的依赖会在这里暴露，而不是等到运行时）
        run: |
          python -c "import sourcepilot.api, sourcepilot.mcp_server, sourcepilot.collector"

      - name: ruff
        run: ruff check src tests

      - name: pytest
        run: pytest -q

  # MCP 出口单独一档，并且**两个 SDK 大版本都跑**。
  # 这一档是有来历的：第一次 CI 就在这里红了——mcp 2.0 把低层 Server 的装饰器
  # 换成了构造参数回调，本机装的 1.x 全绿、干净环境装到 2.x 整个出口起不来。
  # 所以这里钉的是「两版都能起」，而不是钉一个版本躲过去。
  mcp:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: "mcp>=1.2,<2"
            label: "1.x（装饰器 API）"
          - sdk: "mcp>=2"
            label: "2.x（回调 API）"
    name: mcp ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "${{ matrix.sdk }}"
      - name: 报一下实际装到的版本
        run: python -c "import importlib.metadata as m; print('mcp', m.version('mcp'))"
      - name: 构造 MCP Server 并调用两个 handler
        run: |
          python -c "
          import mcp.types as types
          from sourcepilot.mcp_server import create_server, tool_schemas
          server = create_server()
          if hasattr(server, 'get_request_handler'):
              entry = server.get_request_handler('tools/list')
              assert entry is not None, 'tools/list 没注册'
          else:
              assert types.ListToolsRequest in server.request_handlers, 'tools/list 没注册'
          names = [s['name'] for s in tool_schemas()]
          print('MCP 工具:', names)
          assert len(names) >= 6, names
          "
      - run: pytest -q tests/test_mcp.py
