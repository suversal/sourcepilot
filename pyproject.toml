[project]
name = "sourcepilot"
version = "0.1.0"
description = "面向 Agent 的弹性信息采集平台：看见 · 抓取 · 归一化"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourcepilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
# 放宽到 100：中文注释按字符计宽，88 下几乎每条说明都要折行。
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
