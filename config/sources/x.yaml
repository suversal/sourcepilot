# X（Twitter）channel。已启用常驻采集，抓下面 accounts 列的账号时间线。
#
# 注意区分两条路：这里配的账号走定时采集，落库标 origin=collected，会进
# 信息流与 RSS；而 search_x / get_x_timeline 的现查结果标 origin=searched，
# 只作降级缓存——调用方随口给的 query 不该污染所有订阅者的内容。
#
# ── 三个后端，按能力分工（实测 2026-07-26）──────────────────
#   fxtwitter  单推 / 用户资料   零认证 ✅ 已验证（能拿到互动数）
#   nitter     时间线           零认证 ✅ 已验证（nitter.net 出 19 条真推文）
#   graphql    搜索 / 时间线     **需登录 cookie**
#
# ── 为什么搜索必须登录 ──────────────────────────────────
#   Nitter 各实例的搜索一律返回 0 条（搜索最费上游配额，是各实例最先关的功能）
#   xcancel 要求 RSS 客户端先备案
#   X 自己的 guest token 还能激活，但旧的 /2/search/adaptive.json 已下线
#   → 免登录搜 X 已经没有路了
#
# ── 怎么配账号 ─────────────────────────────────────────
#   写进 config/x_accounts.yaml（已在 .gitignore 里）：
#     accounts:
#       - name: acct1
#         cookie: "auth_token=...; ct0=..."     # 从浏览器开发者工具复制
#   cookie 里必须有 ct0——GraphQL 要求 x-csrf-token 与它相等，缺了一定被拒。
#   **强烈建议用专用小号**：这条线抓的是内部 GraphQL，有封号风险。
#
# 时间线优先走 GraphQL，Nitter 作降级。这个顺序调过一次：原本 Nitter 优先
# （省账号配额），但它走的是 RSS——实测一条目里只有 title/link/summary/
# published/author 五个字段，互动数、引用链、长文一个都没有，于是订阅采集
# 的推文进不了 x_tweets 表。当初「能不动用账号就不动」的权衡没错，错在加了
# 推文全貌表之后没回头看它的前提还成不成立。
name: x
display_name: X / Twitter
type: x
platform: x
enabled: true
channel: x
min_interval: 3600
lang: en

# 自建 Nitter 实例（公共实例寿命很短，实测只剩 nitter.net 的时间线还活着）
nitter_instances: []

# 定时采集这些账号的时间线进库。库里有东西，search_x 现查失败时的降级才有意义。
per_account_limit: 20
accounts:
  # OpenAI / Anthropic
  - OpenAI
  - AnthropicAI
  - claudeai
  - ClaudeDevs

  # Google / xAI / Meta / Microsoft
  - GoogleAI
  - GoogleDeepMind
  - xai
  - grok
  - AIatMeta
  - MicrosoftAI

  # 开源与基础设施
  - MistralAI
  - huggingface
  - nvidia

  # 国内主流模型
  - deepseek_ai
  - Alibaba_Qwen
  - Kimi_Moonshot
  - Zai_org
  - TencentHunyuan
  - ManusAI

  # 个人账号
  - thsottiaux
  - xiaohu
  - dotey

# 话题订阅（契约 §5.5）：事件追踪，与账号订阅平级的第二条腿。
# 账号盖「官方说了什么」，话题盖「这个事件下大家在说什么」。
# 结果标 origin=topic 进信息流；x_tweets.topics 带话题标识。
# 注意：话题搜索走登录账号池（最贵的通道），少而精，别开闸放水。
# query 用 X 搜索语法，min_faves 在上游过滤；min_likes 是采集侧兜底阈值。
topics:
  # sort 默认 top（X 的热门排序）。中文圈子小，min_faves 放低，靠 Top 排序出热度。
  - name: ai-hot
    query: '(OpenAI OR ChatGPT OR GPT OR Anthropic OR Claude OR Gemini OR DeepMind OR xAI OR Grok OR "Meta AI" OR Llama OR Microsoft OR Copilot OR Mistral OR NVIDIA OR HuggingFace OR DeepSeek OR Qwen OR 通义千问 OR Kimi OR 月之暗面 OR GLM OR 智谱 OR 豆包 OR MiniMax OR Manus OR ERNIE OR 文心 OR Hunyuan OR 混元) (发布 OR 推出 OR 上线 OR 更新 OR 开源 OR release OR launch OR announce OR update OR "open source") min_faves:5 -filter:replies'
    sort: latest
    limit: 20

  - name: u-card
    query: '"U卡" (推荐 OR 套餐 OR 资费 OR 测评) min_faves:5 -filter:replies'
    sort: top
    limit: 10

  - name: esim
    query: 'eSIM (推荐 OR 套餐 OR 测评 OR travel OR roaming) min_faves:10 -filter:replies'
    sort: top
    limit: 10
