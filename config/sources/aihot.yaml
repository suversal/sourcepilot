# ⚠️ 全仓库唯一一个「二手聚合源」——它给的不是一手信源，是别人聚合好的结果。
#
# AIHOT 是本项目的对标对象（见 CLAUDE.md），newsnow 也把它列在科技分类里。
# 公开匿名只读 API，接进来没问题，但要清楚它的性质：
#   - 它挂了/改版了，我们这条线就断，而且查不出根因（看不到它的上游）
#   - 内容可能与我们自己接的一手源重复，跨源去重做出来之后要注意
# 其余 23 个源都是直连平台自己的接口，只有这个不是。
#
# 对照：参考项目里 TrendRadar 就是直接吃 newsnow 的 API，我们刻意不那么做——
# 「借鉴方法、自己实现，拥有核心，不依赖它们的维护周期」。
name: aihot
display_name: AIHOT 中文 AI 资讯
type: hotlist
platform: aihot
enabled: true
min_interval: 600
lang: zh

request:
  url: https://aihot.virxact.com/api/public/items?mode=all&take=30

extract:
  format: json
  list: items
  fields:
    native_id: id
    title: title
    url: url
    summary: summary
    published_at: { path: publishedAt, type: iso }
