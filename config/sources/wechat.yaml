# 公众号 channel。默认禁用——它必须有登录凭据才能工作。
#
# 为什么不能匿名：mp.weixin.qq.com 的 searchbiz 与 appmsgpublish 两个接口，
# 不带登录态一律返回 {"ret":200003,"err_msg":"invalid session"}（实测 2026-07-26）。
#
# 怎么拿凭据（两条路，任选，都写进 config/wechat_credentials.yaml）：
#
#   路线 A · 手动复制（推荐先用这条）
#     在自己浏览器里正常登录 mp.weixin.qq.com，然后：
#       token  ← 地址栏 URL 里 token= 后面那串数字
#       cookie ← 开发者工具 → Network → 任一请求 → Request Headers 里的 Cookie
#     写成：
#       token: "1234567890"
#       cookie: "slave_sid=...; slave_user=...; bizuin=..."
#     完全不涉及自动化登录，风控面最小。
#
#   路线 B · 扫码
#     python -m sourcepilot.channels.login
#     会存一张二维码图片并打印路径，用**专用微信小号**扫（别用主号）。
#     实测裸 HTTP 就能跑通这套流程，不需要浏览器驱动——参考项目 we-mp-rss 上
#     Playwright 主要是为了顺带做多账号切换和指纹伪装，纯登录用不着。
#
#   拿到凭据后把下面 enabled 改成 true，填上要订阅的公众号名。
#
# 这块是全平台最可能被官方封的一条线，所以整块隔离在 channels/wechat.py，
# 坏了整块换掉，不牵动其它信源。
name: wechat
display_name: 微信公众号
type: wechat
platform: wechat
enabled: true
channel: wechat
min_interval: 3600
lang: zh

# 后端降级链：按顺序试，前一个失败就换下一个。
#
#   mp    公众平台——需凭据。按号精确、按时间倒序、链接永久。**唯一可用的主力**。
#   sogou 搜狗——免凭据零账号风险，但**实测下来不适合当资讯源**，默认不启用。
#
# 搜狗实测数据（2026-07-26，各取 10 条）：
#   量子位   → 只出 2 条，其中一条是 2019 年的
#   机器之心 → 9 条全是 2017 年的
#   新智元   → 第三个号就触发验证码
#   加 sortType=1&tsn=1 想按时间排序 → 返回 0 条，排序参数无效
# 原因：搜狗给的是「按相关性排的搜索结果」，不是「按时间倒序的文章流」；
# 而且每条都要额外请求还原跳转地址，约 20 次就撞验证码。
#
# 所以默认只用 mp。要开搜狗就写 backends: [mp, sogou]，但要清楚它给的多半是
# 几年前的旧文——好在 published_at 抽得准，window 过滤会自动把它们挡在近期窗口外。
backends: [mp]

# 每个账号取多少条，以及账号之间的请求间隔（公众平台对连续请求很敏感）
per_account_limit: 10
account_interval: 3.0

accounts:
  - 量子位
  - 机器之心
