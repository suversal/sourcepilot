# 公众号 channel。**主力后端 2026-08-06 起换成微信读书（weread）。**
#
# 公众平台（mp）那条路被微信关了，但微信读书是**另一套系统**，不受影响——
# 实测公开的 Wechat2RSS 服务（其文档写明「通过读书获取公众号信息」）在关闭之后
# 仍在输出当天文章。mp 保留在降级链里：它字段更全，能力若恢复就该优先用回它。
#
# ── 用 weread 需要做的两件事 ────────────────────────────────
#
#   1. 凭据：浏览器登录 weread.qq.com，开发者工具 → Network → 任一请求的
#      Request Headers → 复制整条 Cookie，写进 config/weread_credentials.yaml：
#          cookie: "wr_vid=...; wr_skey=..."
#   2. 书架里至少放一个公众号：随便哪个都行，**不必把下面 accounts 里的号
#      逐个加进去**。加法是在微信里打开某个号的文章 → 分享 → 在微信读书中阅读。
#      原因：`/web/mp/articles` 要带阅读器页 Referer，而那道校验只认
#      「Referer 是不是合法阅读器页」，不比对 bookId——实测（2026-08-06）拿书架里
#      某个 Kimi 号的阅读器页去拉根本不在书架里的量子位，返回 77 篇、最新是当天的。
#      所以书架只是用来换一张通行证。
#
#   核对：python -m sourcepilot.channels.wechat.weread_check
#   它会报书架接口是否正常、能否换到通行证、并真拉一次文章。
#
# ── weread 的固有局限（平台侧的，别当 bug 修）────────────────
#   收录滞后：部分号在微信读书侧收录慢，实测遇到过滞后半个多月的。
#   不实时：通常比公众号发布晚几小时（Wechat2RSS 公开服务平均 6 小时）。
#   有反爬：参考实现作者实测一天 30 多次快速请求就白屏几小时。**所以下面
#           min_interval 设成 6 小时而不是 1 小时**——23 个号一轮就是 24 个请求
#           （1 次书架 + 23 次文章），一天 4 轮≈96 次已经不算少。撞到风控就把
#           min_interval 和 account_interval 一起往上调，别指望重试能救。
#   fakeid 是必需的：weread 靠 bookId = "MP_WXS_" + base64解码(fakeid) 定位，
#           没有 fakeid 的号会被跳过（微信读书网页端搜不到公众号名，
#           实测多种参数组合全返回图书，所以没法按名字兜底）。
#
# ── mp 后端为什么现在拿不到数据（留档，别再重新排查一遍）──────
#
# `appmsg?action=list_ex` 一律返回 {"ret":200013,"err_msg":"freq control"}，
# 而**同一套凭据打 searchbiz 仍返回 ret=0**。也就是登录态是好的、请求形状是对的
# （7-26/27 用同一份代码采过 169 条入库），只有「跨公众号列表」这一个能力被拒。
#
# ── 停用原因（实测，不是猜测）────────────────────────────────
# `appmsg?action=list_ex` 一律返回 {"ret":200013,"err_msg":"freq control"}，
# 而**同一套凭据打 searchbiz 仍返回 ret=0**。也就是登录态是好的、请求形状是对的
# （7-26/27 用同一份代码采过 169 条入库），只有「跨公众号列表」这一个能力被拒。
#
# 排除法做过四组对照（2026-08-06）：
#   换公众号主体（bizuin 3682394198 → 3571713780）  → 仍 200013
#   换个人微信号（wxuin 73560367361038 → 86006527962718）→ 仍 200013
#   IPv6 出口 / 强制 IPv4 出口                      → 均 200013
#   searchbiz 同凭据同时刻                          → ret=0 正常
# 所以既不是账号被封、不是我们把额度打爆、也不是 IP 维度。
#
# 同期至少三个独立开源项目报同一现象，共同特征是**第一页、零结果就被拒**
# （历史上的累计频控是跑几小时或翻几十页之后才出现）：
#   we-mp-rss #440（2026-07-30，已独立核实：正文写明 ret==200013 + stop at 0）
#   wechat-article-exporter #199（7-30）、wechat-download-api #22（7-31，
#   同样记录「搜索与单篇成功、列表失败」的分裂）
# 微信没有发公告，所以「永久关闭」属证据支持的推断，不是官方确认。
#
# ── 其它替代路线的排查结论（都不如 weread，留档免得重探）────────
#   搜狗：账号索引已死（type=1 回「暂无相关的官方认证订阅号」）；文章搜索还在，
#         但是按相关性排的关键词搜索——搜「量子位」9 条里 8 条是 2019-2022 老文，
#         还混进「量子位=qubit」的量子计算文章，且移动入口结果**不带发布者字段**，
#         没法做「精确发布者过滤」。usip/tsn/sortType 参数一律返回空页。
#   wewe-rss：自己不实现微信读书协议，而是转发给作者托管的第三方
#         https://weread.111965.xyz（无 token 回 401）。所以它不能当参考实现。
#   Wechat2RSS：现成可用（¥150/年私有部署），但用户协议写死「禁止商用和内容分发」。
#   profile_ext/getmsg：需要 __biz/uin/key 这套微信客户端短期凭据，
#         与后台 token+cookie 不是同一个凭据模型，且 key 二十分钟级过期。
#   注意：`weread.qq.com/web/search/global` 只搜图书，别拿它验证微信读书能不能用
#         ——公众号走的是 /web/mp/* 那组接口，需要登录态，是两回事。
#
# ── mp 什么时候能用回来 ──────────────────────────────────
# 跑 `python -m sourcepilot.channels.wechat.check`，若 appmsg 回 ret=0
# 就说明能力放开了，把下面 backends 改成 [mp, weread] 即可，代码不用动。
# 别为了「碰碰运气」把 mp 排在前面长期跑——每次尝试都在消耗那个账号的额度。
#
# ── 以下是原有的凭据说明，能力恢复后仍然适用 ──────────────
#
# 它必须有登录凭据才能工作。
#
# 为什么不能匿名：mp.weixin.qq.com 的 searchbiz 与 appmsgpublish 两个接口，
# 不带登录态一律返回 {"ret":200003,"err_msg":"invalid session"}（实测 2026-07-26）。
#
# 怎么拿凭据（两条路，任选，都写进 config/wechat_credentials.yaml）：
#
#   路线 A · 手动复制（推荐先用这条）
#     在自己浏览器里正常登录 mp.weixin.qq.com，然后：
#       token  ← 地址栏 URL 里 token= 后面那串数字
#       cookie ← 开发者工具 → Network → 任一请求 → Request Headers 里的 Cookie
#     写成：
#       token: "1234567890"
#       cookie: "slave_sid=...; slave_user=...; bizuin=..."
#     完全不涉及自动化登录，风控面最小。
#
#   路线 B · 扫码
#     python -m sourcepilot.channels.login
#     会存一张二维码图片并打印路径，用**专用微信小号**扫（别用主号）。
#     实测裸 HTTP 就能跑通这套流程，不需要浏览器驱动——参考项目 we-mp-rss 上
#     Playwright 主要是为了顺带做多账号切换和指纹伪装，纯登录用不着。
#
#   拿到凭据后把下面 enabled 改成 true，填上要订阅的公众号名。
#
# 验证凭据：python -m sourcepilot.channels.wechat.check
#   它**两个接口都打**。公众平台按接口分别限流，实测出现过 searchbiz 正常
#   而 appmsg 返回 200013 freq control 的情况——只验证搜索接口会得出
#   「凭据没问题」的错误结论，而采集走的恰恰是 appmsg。
#   看到 200013 时不要反复重试，那正是把额度耗光的原因。
#
# 这块是全平台最可能被官方封的一条线，所以整块隔离在 channels/wechat.py，
# 坏了整块换掉，不牵动其它信源。
name: wechat
display_name: 微信公众号
type: wechat
platform: wechat
enabled: true
channel: wechat
# 6 小时。**不是随便定的**：weread 那条路有反爬，一轮 24 个请求，一天 4 轮≈96 次
# 已接近安全上限（参考实现作者一天 30 多次快速请求就被白屏几小时）。
# 公众号本来也不是分钟级的信源，收录本身就滞后几小时，抓更勤没有收益。
min_interval: 21600
lang: zh

# 后端降级链：按顺序试，前一个失败就换下一个。
#
#   weread 微信读书——需微信读书 cookie + 号要在书架里。**当前唯一可用的主力**。
#   mp     公众平台——需凭据。字段最全，但跨号列表能力被微信关了（见文件头），
#          现在放它在链里只会每轮白撞一次 200013，所以**暂时不放进 backends**。
#   sogou  搜狗——免凭据零账号风险，但**实测下来不适合当资讯源**，默认不启用。
#
# 搜狗实测数据（2026-07-26 桌面入口 / 2026-08-06 复测移动入口，均不可用）：
#   量子位   → 只出 2 条，其中一条是 2019 年的
#   机器之心 → 9 条全是 2017 年的
#   新智元   → 第三个号就触发验证码
#   加 sortType=1&tsn=1 想按时间排序 → 返回 0 条，排序参数无效
#   移动入口 weixinwap → 结果里**不带发布者字段**，没法按公众号过滤；
#   账号索引 type=1    → 直接回「暂无与 X 相关的官方认证订阅号」，已死
# 原因：搜狗给的是「按相关性排的搜索结果」，不是「按时间倒序的文章流」，
# 搜「量子位」还会把「量子位=qubit」的量子计算文章混进来。
#
# mp 能力恢复后改成 [mp, weread]——它字段更全（有 digest 摘要和封面图），
# 该优先用；weread 退居降级位，两者失效方式互不相关，那才是有意义的降级链。
backends: [weread]

# 每个账号取多少条，以及账号之间的请求间隔。
# 3 秒是参考实现验证过的节奏；weread 有反爬，撞到就往上调，别调小。
per_account_limit: 10
account_interval: 3.0

# 全部写死 fakeid，不走按名字搜索。两个理由都是正确性而不是优化：
#   1. 同名号/停更旧号在公众平台上极常见。实测搜「智谱AI」命中的是个 2022 年
#      就停更的号（智谱现在发内容的是「智谱清言」），搜「Kimi」命中的是 2018 年
#      一个讲电影票的无关号。
#   2. 不给 fakeid 的话每个号每轮都要先搜一次，18 个号就是 18 次搜索，
#      而搜索正是公众平台上最容易触发风控的动作。
# 下面每个号的最近更新时间都实测过（2026-07-26），停更的没收进来。
#
# 加新号：python -m sourcepilot.channels.wechat.lookup <名字>
accounts:
  # ── 国产大模型厂商官方号 ──────────────────────
  # alias 是微信号：不参与请求，但 nickname 会改会重名，微信号不会。
  # fakeid 哪天失效时靠它重新查回来（lookup 会按 alias 精确匹配）。
  - { name: 智谱清言,          fakeid: MzkwMDU2MTEwMg== }
  - { name: 智谱,             fakeid: MzkyMzI3NzQ0Mg==, alias: zhipu_ai }
  - { name: Kimi开放平台,      fakeid: MzkyNzY4NDEzNA== }
