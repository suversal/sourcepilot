# 2026-07-26 改用官方 RSS。原先抓 /list/ 列表页，实测对比：
#   HTML 列表页  169 条，有时间，**摘要全空**
#   官方 RSS      60 条，有时间，摘要 800+ 字
# 摘要对下游是硬需求（AIRADAR 的初筛拿标题+摘要喂 LLM），空摘要等于让它裸判。
# 条目数少了但每条更完整，且 RSS 结构比 CSS 选择器稳得多。
# 这个源支持 ETag，条件请求能命中。
name: ithome
display_name: IT之家
type: hotlist
platform: ithome
enabled: true
min_interval: 600
lang: zh

request:
  url: https://www.ithome.com/rss/

extract:
  format: rss
  # RSS 里同样混推广位，规则沿用列表页那套。
  exclude_if:
    title: [神券, 优惠, 补贴, 京东]
    url: [lapin]
