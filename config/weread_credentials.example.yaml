# 复制成 config/weread_credentials.yaml 再填（那个文件已在 .gitignore 里，不会进仓库）。
#
# 这是**公众号采集当前的主力路线**（`config/sources/wechat.yaml` 的 backends: [weread]）。
# 微信读书是与公众平台完全独立的另一套系统，只要 cookie，没有 token。
#
# ── 怎么取 ──────────────────────────────────────────────
# 1. 浏览器登录 https://weread.qq.com，确认左上角显示的是你的头像；
# 2. F12 → Application → Cookies → https://weread.qq.com；
# 3. 确认列表里能看到 wr_vid 和 wr_skey，再把整串 Cookie 复制过来。
#
# ── 必须含 wr_vid 与 wr_skey ────────────────────────────
# 少了它们照样能过书架那道浅校验，却会在真正拉文章时回 -2010/-2041——
# 看着像被风控，实际只是复制得不全（整串里只有 _qimei_*/_clck 这类埋点键，
# 说明复制时没登录，或是在别的腾讯域名下复制的）。
#
# ── 书架里要有至少一个公众号 ─────────────────────────────
# `/web/mp/articles` 要带阅读器页 Referer 才不返回 -2041，而那串 hash 只能从
# 书架的 deepLink 取。**但订阅的号不必逐个加书架**——那道校验只认「Referer 是不是
# 合法的阅读器页」，不比对 bookId。书架里有任意一个公众号能换到通行证即可，一次性设置。
#
# ── wr_skey 一两天就过期 ─────────────────────────────────
# 代码会用 cookie 里的 wr_rt（refresh token）自动续期并写回本文件，所以正常不用手动换。
# 真回了 AUTH_EXPIRED 才需要重新登录复制一次。
#
# 配好后自检：python -m sourcepilot.channels.wechat.weread_check

cookie: "wr_vid=<你的>; wr_skey=<你的>; wr_rt=<你的>; ..."
