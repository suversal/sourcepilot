# 复制成 config/wechat_credentials.yaml 再填（那个文件已在 .gitignore 里，不会进仓库）。
#
# 这是公众平台（mp.weixin.qq.com）后台接口的凭据，对应 mp 后端。
#
# ⚠️ **当前 mp 后端不可用，配了也抓不到文章。** 微信在 2026-07-30 前后收紧了第三方
# 跨公众号调用文章列表的权限：`appmsg?action=list_ex` 恒回 ret=200013，而同一套凭据打
# searchbiz 仍然 ret=0。换公众号主体、换个人微信号、换 IPv4/IPv6 出口全部无效。
# 公众号采集现在走微信读书（见 weread_credentials.example.yaml）。
# 这份模板留着是因为 searchbiz 还能用——查 fakeid 要它（lookup 工具）。
#
# ── 怎么取（推荐手动复制，无自动化痕迹）─────────────────────
# 1. 浏览器登录 https://mp.weixin.qq.com（需要公众号主体）；
# 2. 地址栏里 `?token=1234567890` 那串数字就是 token；
# 3. F12 → Network → 任一 cgi-bin 请求 → Request Headers → 复制整条 Cookie。
#
# 或者跑扫码助手：python -m sourcepilot.channels.login
# （裸 HTTP 的扫码流程，不需要 Playwright）
#
# ── 建议用专用小号 ───────────────────────────────────────
# 走的是后台接口不是官方开放 API，这是最容易被封的一条线。
#
# 配好后自检：python -m sourcepilot.channels.wechat.check
# 它 searchbiz 与 appmsg 两个接口都打——公众平台按接口分别限流，只验搜索会得出
# 「凭据没问题」的错误结论，而采集走的恰恰是 appmsg。

token: "<地址栏 ?token= 后面那串数字>"
cookie: "<整条 Cookie>"
